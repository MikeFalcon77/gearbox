# cargo-deny configuration for security, licenses, bans, and sources.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Ported from gears-rust/deny.toml. The policy -- which licences are acceptable,
# which crates are banned, which registries are trusted -- is identical on
# purpose: a dependency rejected there should be rejected here for the same
# reason. What is NOT carried over is that repository's accumulated escapes:
# its five `[advisories].ignore` entries and both `[licenses].exceptions` name
# crates that are not in this dependency graph, so importing them would be
# pre-approving vulnerabilities this workspace has never been exposed to.

################################################################################
# Dependency graph construction
################################################################################
[graph]
# Optionally restrict targets to check (kept commented by default).
# targets = [
#   "x86_64-unknown-linux-gnu",
#   { triple = "wasm32-unknown-unknown", features = ["atomics"] },
# ]
# all-features = true
# exclude-dev = true
# exclude-unpublished = false

################################################################################
# Security advisories (RustSec)
################################################################################
[advisories]
# Local clone/cache of the RustSec advisory DB (gitignored).
db-path = ".cargo/advisory-db"
# Upstream advisory DBs to use
db-urls = ["https://github.com/RustSec/advisory-db"]

# How to treat "unmaintained" advisories:
# one of: "all" | "workspace" | "transitive" | "none"
# (This is NOT a severity level; it scopes where the rule applies.)
unmaintained = "workspace"

# Yanked crate versions still use classic lint levels.
# one of: "deny" | "warn" | "allow"
yanked = "warn"

# List of advisory IDs to ignore (RUSTSEC-YYYY-XXXX, etc.).
#
# Deliberately empty. Every entry here is a vulnerability someone decided to
# live with, so each one belongs with the reasoning that justified it and the
# condition under which it can be removed -- not inherited from another repo.
ignore = []

# Note:
# - Modern cargo-deny versions treat vulnerabilities as hard errors by default.
# - If you must silence a specific vuln, add its ID to `ignore` above.

################################################################################
# License policy
################################################################################
[licenses]
# Allow-list of SPDX license IDs
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "OpenSSL",
]

# Confidence threshold (0.0..1.0) for license text detection
confidence-threshold = 0.8

# Per-crate exceptions (license(s) allowed only for a specific crate/version).
#
# Deliberately empty -- see the header note. An exception is a reviewed decision
# about one crate at one version; it does not transfer between repositories.
exceptions = []

# Private workspace crates handling
[licenses.private]
# If true, ignore unpublished/private workspace crates for license checks.
#
# DEVIATION from gears-rust, which sets false: its crates are published under
# Apache-2.0, so the allow-list applies to them. Every crate here is
# `publish = false`, and this policy is about what third-party code we are
# willing to depend on -- not about how we license ourselves.
ignore = true
# Private registries considered "published" for the rule above
registries = [
  # "https://example.com/registry",
]

################################################################################
# Duplicate versions / wildcards / bans
################################################################################
[bans]
# Multiple versions of the same crate in the graph
multiple-versions = "warn"

# Version wildcards like "*"
wildcards = "allow"

# How to highlight in dot graphs when multiple versions are present
# "lowest-version" | "simplest-path" | "all"
highlight = "all"

# Default lint level for `default-features` on workspace deps (requires the
# `workspace-dependencies` feature in cargo-deny to take effect)
workspace-default-features = "allow"

# Allow-list of specific crates (use carefully)
allow = [
  # { name = "ansi_term", version = "=0.11.0" },
]

# Deny-list of specific crates (optionally with version ranges/wrappers)
deny = [
  # proc-macro-error2 / proc-macro-error-attr2 are unmaintained
  # (RUSTSEC-2026-0173), as is the original pair they forked from. Banned
  # outright rather than relying on `unmaintained = "workspace"` to happen to
  # flag them, because they can return transitively through a macro crate.
  { name = "proc-macro-error2" },
  { name = "proc-macro-error-attr2" },
  { name = "proc-macro-error" },
  { name = "proc-macro-error-attr" },
]

# Skip specific crate versions when checking for duplicates
skip = [
  # { name = "ansi_term", version = "=0.11.0" },
]

# Remove a crate subtree entirely from the graph for checks (stronger than skip)
skip-tree = [
  # { name = "ansi_term", version = "=0.11.0", depth = 1 },
]

################################################################################
# Allowed sources (registries and git)
################################################################################
[sources]
# Non-allowed registry encountered
unknown-registry = "warn"

# Non-allowed git source encountered
unknown-git = "warn"

# Allowed crate registries (empty list => none allowed)
# Default crates.io index:
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allowed git repositories (empty => none)
allow-git = []

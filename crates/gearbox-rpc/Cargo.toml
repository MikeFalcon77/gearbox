[package]
name = "gearbox-rpc"
description = "JSON-RPC over stdio with LSP framing: the engine's wire surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gearbox-engine.workspace = true
gearbox-ir.workspace = true
# Framing, not a whole LSP implementation. Byte-compatible with
# `vscode-jsonrpc`'s reader/writer, which is the requirement, and it is the crate
# rust-analyzer uses for exactly this. Hand-rolling `Content-Length` is easy to
# get *almost* right, and almost means a silently incompatible protocol.
lsp-server = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true

[dev-dependencies]
gearbox-rpc.workspace = true

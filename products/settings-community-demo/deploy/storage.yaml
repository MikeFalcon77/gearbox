apiVersion: v1
kind: Namespace
metadata:
  name: gearbox-demo
  labels:
    app.kubernetes.io/part-of: settings-community-demo
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gearbox-demo-retain
  labels:
    app.kubernetes.io/part-of: settings-community-demo
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gearbox-demo-gateway-data
  namespace: gearbox-demo
  labels:
    app.kubernetes.io/part-of: settings-community-demo
spec:
  storageClassName: gearbox-demo-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
